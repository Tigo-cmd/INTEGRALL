# Integrall broker: every client must log in. Accounts and ACLs live in the
# dynamic-security plugin and are managed by the backend.
allow_anonymous false

listener 1883
# For internet-facing deployments use TLS instead (and close 1883):
# listener 8883
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout
