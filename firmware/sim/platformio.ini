; Wokwi simulation builds: real example sketches compiled for a virtual ESP32
; wired to virtual parts (see */diagram.json). No hardware needed.
;
; 1) Build:     cd firmware/sim && pio run -e parking      (or keypadlock / weather)
; 2) Simulate:  VS Code + "Wokwi Simulator" extension: open sim/parking/diagram.json
;               and press Start — or headless in CI:
;               WOKWI_CLI_TOKEN=... wokwi-cli parking --timeout 10000 --expect-text "Dist:"
;    (free token: https://wokwi.com/dashboard/ci)
[platformio]
src_dir = .

[sim]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
lib_deps =
    symlink://../Integrall
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    chris--a/Keypad @ ^3.1.1
build_flags = -D INTEGRALL_DEBUG_LEVEL=3

[env:parking]
extends = sim
build_src_filter = -<*> +<parking/>

[env:keypadlock]
extends = sim
build_src_filter = -<*> +<keypadlock/>

[env:weather]
extends = sim
build_src_filter = -<*> +<weather/>
