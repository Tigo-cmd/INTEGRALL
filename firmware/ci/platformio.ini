; Integrall compile-verification matrix.
; Used by firmware/ci/build_all.sh — every example and CI sketch is built
; against every compatible board below. This is NOT a user project template.

[platformio]
default_envs = esp32dev

[common]
framework = arduino
; deep+ makes the Library Dependency Finder evaluate the __has_include()
; guards Integrall uses for optional drivers.
lib_ldf_mode = deep+
lib_deps_common =
    bblanchon/ArduinoJson @ ^7.2.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit INA219 @ ^1.2.3
    chris--a/Keypad @ ^3.1.1
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6
    adafruit/RTClib @ ^2.1.4
    mikalhart/TinyGPSPlus @ ^1.1.0
    miguelbalboa/MFRC522 @ ^1.4.11
    sandeepmistry/LoRa @ ^0.8.0
    bertmelis/espMqttClient @ ^1.7.3
build_flags_common =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -D INTEGRALL_DEBUG_LEVEL=3
    -I ${sysenv.INTEGRALL_CI_SKETCHES}

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = ${common.framework}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps =
    ${common.lib_deps_common}
    madhephaestus/ESP32Servo @ ^3.0.6
build_flags = ${common.build_flags_common}
; ESP32 builds default to -fpermissive, which turned a real pointer/int bug
; (INA219 begin(addr)) into a mere warning. CI is strict.
build_unflags = -fpermissive

; ESP32 Arduino core 3.x (the core the Arduino IDE installs today) via the
; community pioarduino platform. Official espressif32 above is core 2.0.x.
[env:esp32dev_core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = ${common.framework}
; core 3's WiFi depends on its internal "Network" lib, which deep+ fails to resolve
lib_ldf_mode = chain
lib_deps =
    ${common.lib_deps_common}
    madhephaestus/ESP32Servo @ ^3.0.6
build_flags = ${common.build_flags_common}
build_unflags = -fpermissive

[env:esp32cam]
platform = espressif32 @ ^6.9.0
board = esp32cam
framework = ${common.framework}
lib_ldf_mode = ${common.lib_ldf_mode}
board_build.partitions = huge_app.csv
lib_deps =
    ${common.lib_deps_common}
    madhephaestus/ESP32Servo @ ^3.0.6
build_flags = ${common.build_flags_common} -D BOARD_HAS_PSRAM
build_unflags = -fpermissive

[env:nodemcuv2]
platform = espressif8266 @ ^4.2.1
board = nodemcuv2
framework = ${common.framework}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps =
    ${common.lib_deps_common}
    ESP32Async/ESPAsyncTCP @ ^2.0.0
build_flags = ${common.build_flags_common}

[env:uno]
platform = atmelavr @ ^5.1.0
board = uno
framework = ${common.framework}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    chris--a/Keypad @ ^3.1.1
    arduino-libraries/Servo @ ^1.2.2
build_flags = -D INTEGRALL_DEBUG_LEVEL=2 -I ${sysenv.INTEGRALL_CI_SKETCHES}
