; Host-side unit tests for Integrall — run the real library logic on your PC
; against a fake Arduino layer (tests/mocks). No board, no parts needed.
;
;   cd firmware/tests && pio test -e native
;
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I mocks
    -I ../Integrall/src
    -D INTEGRALL_HOST_TEST
    -D INTEGRALL_DEBUG_LEVEL=0
    -Wall -Wextra -Wno-unused-parameter
build_src_filter = -<*>
test_build_src = no
