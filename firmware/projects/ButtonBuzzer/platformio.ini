; Flash the ButtonBuzzer example to an ESP32 DevKit.
;   cp include/secrets.h.example include/secrets.h     # then fill in WiFi / broker / token
;   pio run -t upload && pio device monitor
; The sketch itself lives in the library: Integrall/examples/ButtonBuzzer (edit it there).
[platformio]
src_dir = ../../Integrall/examples/ButtonBuzzer

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; deep+ lets the dependency finder honour Integrall's __has_include() guards (finds HTTPClient, WiFi...)
lib_ldf_mode = deep+
upload_speed = 921600
lib_deps =
    symlink://../../Integrall
    bblanchon/ArduinoJson@^7
    bertmelis/espMqttClient@^1.7.3
build_flags = -I include
